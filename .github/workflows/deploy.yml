name: Deploy public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check exported site
        run: |
          test -f site/index.html
          test -f site/deployment.json
          test -z "$(find site -type l -print -quit)"
          test -z "$(find site \( -name .env -o -name '.env.*' -o -name .git -o -name .admin-private -o -name node_modules -o -name resources -o -name '*.map' \) -print -quit)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
